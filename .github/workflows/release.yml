name: Build Obsidian Plugin

# adapted from https://github.com/argenos/nldates-obsidian/blob/master/.github/workflows/release.yml

on:
    push:
        # Sequence of patterns matched against refs/tags
        tags:
            - '*' # Push events to matching any tag format, i.e. 1.0, 20.15.10
    # Rebuild the current version to attest existing, byte-identical assets.
    workflow_dispatch:

env:
    PLUGIN_NAME: bases-chart-views

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate release version
              id: version
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs';
                  import assert from 'node:assert/strict';
                  const manifest = JSON.parse(fs.readFileSync('manifest.json'));
                  const pkg = JSON.parse(fs.readFileSync('package.json'));
                  assert.match(manifest.version, /^\d+\.\d+\.\d+(?:-[\w.-]+)?$/);
                  assert.equal(pkg.version, manifest.version);
                  assert.equal(manifest.id, process.env.PLUGIN_NAME);
                  if (process.env.GITHUB_EVENT_NAME === 'push') {
                      assert.equal(process.env.GITHUB_REF_TYPE, 'tag');
                      assert.equal(manifest.version, process.env.GITHUB_REF_NAME);
                  }
                  fs.appendFileSync(process.env.GITHUB_OUTPUT,
                      `tag=${manifest.version}\nprerelease=${manifest.version.includes('canary')}\n`);
                  NODE

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install and validate
              run: |
                  npm ci
                  npm test
                  npm run lint

            - name: Build
              id: build
              run: |
                  npm run build
                  cp manifest.json styles.css dist/

            - name: Verify existing release matches the rebuild
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  release_dir=$(mktemp -d)
                  gh release download "$RELEASE_TAG" --dir "$release_dir" \
                    --pattern main.js --pattern manifest.json --pattern styles.css
                  for asset in main.js manifest.json styles.css; do
                    cmp "dist/$asset" "$release_dir/$asset"
                  done

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css

            - name: Release
              id: release
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ steps.version.outputs.prerelease }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
