name: Build Obsidian Plugin

# adapted from https://github.com/argenos/nldates-obsidian/blob/master/.github/workflows/release.yml

on:
    push:
        # Sequence of patterns matched against refs/tags
        tags:
            - '*' # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
    PLUGIN_NAME: bases-chart-views

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Determine prerelease status
              id: status
              run: |
                  if [[ "${{ github.ref }}" == *"canary"* ]]; then
                    echo "prerelease=true" >> $GITHUB_OUTPUT
                  else
                    echo "prerelease=false" >> $GITHUB_OUTPUT
                  fi

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install and validate
              run: |
                  npm ci
                  npm test
                  npm run lint
                  node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const manifest = JSON.parse(fs.readFileSync("manifest.json")); const pkg = JSON.parse(fs.readFileSync("package.json")); assert.equal(manifest.version, process.env.GITHUB_REF_NAME); assert.equal(pkg.version, manifest.version); assert.equal(manifest.id, process.env.PLUGIN_NAME);'

            - name: Build
              id: build
              run: |
                  npm run build
                  cp manifest.json styles.css dist/
                  mkdir ${{ env.PLUGIN_NAME }}
                  cp dist/main.js dist/manifest.json dist/styles.css ${{ env.PLUGIN_NAME }}
                  zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}

            - name: Release
              id: release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ steps.status.outputs.prerelease }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
